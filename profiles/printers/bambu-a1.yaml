# Bambu Lab A1. Facts read 2026-11-09 from Bambu's official A1 Combo quick-start guide (PDF,
# fetched directly) and Bambu's web pages (seen only as search snippets; the site returns 403 to scripts).
id: bambu-a1
name: Bambu Lab A1
build_volume_mm: [256, 256, 256]
nozzle_diameter_mm: 0.4
nozzle_options_mm: [0.2, 0.4, 0.6, 0.8]
nozzle_material: stainless steel
# Files are AMS-agnostic: they name colors, never units or slots (owner decision 2026-11-09).
multi_material:
  # Files never name a unit. The default palette is the AMS lite's slot count; a job must
  # declare its real cap, because hub-connected units can have fewer slots (see AMS HT).
  default_max_filaments: 4
  default_basis: AMS lite
  units:
    - name: AMS lite
      slots: 4
      connection: direct; one per A1
      # Guide p25: avoid flexible (TPU, TPE), absorbent PVA and fibre-reinforced materials.
      cannot_feed: [TPU, TPE, PVA, PA-CF, PA-GF, PET-CF, PET-GF, PLA-CF, PLA-GF]
      spool_width_mm: [40, 68]
      spool_inner_diameter_mm: [53, 58]
      source: Bambu A1 Combo quick-start guide, p25 (fetched PDF)
    - name: AMS 2 Pro
      connection: through the separate A1 AMS hub; cannot be mixed with an AMS lite
      source: Bambu forum firmware announcement (cited by review); slots and feed limits not verified
    - name: AMS HT
      connection: through the separate A1 AMS hub; cannot be mixed with an AMS lite
      source: "Bambu H2D manual p76: 4 AMS 2 Pro + 8 AMS HT = 24 slots, so an AMS HT has fewer slots than an AMS 2 Pro (1 if the Pro has 4; inference). Not verified directly"
# "Ideal" materials for the printer itself. TPU and PVA are ideal for the printer but must
# come from an external spool, not the AMS lite (see cannot_feed).
materials_recommended: [PLA, PETG, TPU, PVA]
materials_not_recommended: [ABS, ASA, PC, PA, PET, carbon/glass fibre reinforced polymer]
sources:
  - url: https://cdn1.bambulab.com/documentation/quick-start-f507128172bdf/Quick%20start%20guide%20-%20A1%20combo-EN.pdf
    access: fetched PDF (32 pages); text extracted from pages 25 and 30
    accessed: "2026-11-09"
    facts:
      - "p30: build volume 256*256*256 mm3; nozzle 0.4 mm included, 0.2/0.6/0.8 mm optional; stainless steel nozzle"
      - "p30: ideal PLA, PETG, TPU, PVA; not recommended ABS, ASA, PC, PA, PET, carbon/glass fiber reinforced polymer"
      - "p25: avoid using AMS lite for TPU, TPE, absorbent PVA, and fiber-reinforced materials; spools 40-68 mm wide, 53-58 mm bore"
  - url: https://forum.bambulab.com/t/a1-series-firmware-v01-06-10-33-now-in-public-beta/201055
    access: cited by an independent review (Codex, 2026-11-09); not fetched by us
    accessed: "2026-11-09"
    facts:
      - AMS 2 Pro and AMS HT connect to an A1 only through a separate A1 AMS hub, and cannot be mixed with an AMS lite
assumptions:
  - "Jobs default to at most 4 filaments, the AMS lite's slot count. Not every setup has 4 slots (hub-connected AMS HT units have fewer), so a job declares its real cap."
calibration: {}   # filled in from calibration prints; each entry bound to nozzle, material, slicer build and profile hash

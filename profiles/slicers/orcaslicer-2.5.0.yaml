# OrcaSlicer 2.5.0 and the Bambu Lab A1 profiles, pinned for `tdmg slice`.
#
# Every value is copied from research/verification/2026-11-10-orcaslicer-windows/
# (README.md, install-hashes.txt, flattened-hashes.txt, source-manifest.json, flatten.txt),
# except the exit-code table, which is copied from src/libslic3r/Utils.hpp at tag v2.5.0.
# tests/test_slicer.py checks the hashes against those files.
#
# OrcaSlicer is AGPL-3.0. It is only run as a subprocess. No OrcaSlicer code or profile
# file is in this repo: only hashes, preset names and exit-code numbers and names (facts).
id: orcaslicer-2.5.0
name: OrcaSlicer
version: "2.5.0"
tag: v2.5.0
licence: AGPL-3.0 (run as a separate program only; never copied into this repo)
record: research/verification/2026-11-10-orcaslicer-windows/README.md

release:
  platform: windows-x64
  asset: OrcaSlicer_Windows_V2.5.0_x64_portable.zip
  # The standard GitHub release-download URL for this tag and asset. It resolved on
  # 2026-11-10 to a 217,711,758-byte file; the sha256 below is what makes it trusted.
  url: https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.5.0/OrcaSlicer_Windows_V2.5.0_x64_portable.zip
  sha256: e355d9f8ac0be4efa4b4f99ecae448d4e99def8dee97683847ede5aa0ccb9166

exe:

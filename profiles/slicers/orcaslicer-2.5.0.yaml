# OrcaSlicer 2.5.0 and the Bambu Lab A1 profiles, pinned for `tdmg slice`.
#
# Every value is copied from research/verification/2026-11-10-orcaslicer-windows/
# (README.md, install-hashes.txt, flatten.txt, app-tree.txt), except:
# - the exit-code table, copied from src/libslic3r/Utils.hpp at tag v2.5.0;
# - the profile hashes (flat sha256s, manifest_sha256, upstream_sha256) and the machine
#   includes, copied from research/verification/2026-11-13-a1-profile-include/
#   (flattened-hashes.txt, source-manifest.json, flatten-output.txt): since 2026-11-13 the
#   flattener resolves the A1 preset's include key, as OrcaSlicer v2.5.0 does.
# tests/test_slicer.py checks the hashes against those files.
# Lines holding a hash or a URL may exceed 100 characters; they are not wrapped, so each
# value stays copyable as one string.
#
# OrcaSlicer is AGPL-3.0. It is only run as a subprocess. No OrcaSlicer code or profile
# file is in this repo: only hashes, preset names and exit-code numbers and names (facts).
id: orcaslicer-2.5.0
name: OrcaSlicer
version: "2.5.0"
tag: v2.5.0
licence: AGPL-3.0 (run as a separate program only; never copied into this repo)
record: research/verification/2026-11-10-orcaslicer-windows/README.md

release:
  platform: windows-x64
  asset: OrcaSlicer_Windows_V2.5.0_x64_portable.zip
  # The standard GitHub release-download URL for this tag and asset. It resolved on
  # 2026-11-10 to a 217,711,758-byte file; the sha256 below is what makes it trusted.
  url: https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.5.0/OrcaSlicer_Windows_V2.5.0_x64_portable.zip
  sha256: e355d9f8ac0be4efa4b4f99ecae448d4e99def8dee97683847ede5aa0ccb9166

exe:
  path: app/orca-slicer.exe   # relative to the slicer folder the setup script writes
  sha256: e1c85e9b1994c9b1f23d3cc780c5a97bc42e6640a9dfddbe78581630aa54b65f

# Checked with the exe before every run (tdmg.slicer.locate): the slicer's main library.
libraries:
  - path: app/OrcaSlicer.dll
    sha256: 4c6a3772c21851623dfa88860f530a9971288bc8ca6e0d0b6b914c145cb987af

# Every file under app/, checked by the setup script and by --verify-only. The tree hash
# is the SHA-256 of the UTF-8 lines "<path relative to app/, with />\t<file sha256>\n",
# sorted as Python strings (app_tree_hash.py in the research record).
app_tree:
  folder: app
  files: 4054
  sha256: b5cf3ff821f71bb6dbfb07b2fb1e806ee15e58e5af76d605d59182f0a2c33402

profiles:
  folder: profiles-flat        # relative to the slicer folder
  # Upstream files are read from this base; the vendor index maps preset names to files.
  source_base: https://raw.githubusercontent.com/OrcaSlicer/OrcaSlicer/v2.5.0/resources/profiles/
  vendor: BBL
  # The merge: each chain parent first; at each preset, the templates its include key
  # names (in order, without their type, name and instantiation), then the preset's own
  # keys (OrcaSlicer v2.5.0 PresetBundle::resolve_vendor_preset; 2026-11-13 record). These
  # keys are then dropped, and "name" is set to the leaf preset and "from" to "User".
  drop_keys: [inherits, include, from, instantiation, setting_id, description]
  flat:
    machine:
      file: machine.json
      preset: Bambu Lab A1 0.4 nozzle
      chain: [fdm_machine_common, fdm_bbl_3dp_001_common, Bambu Lab A1 0.4 nozzle]
      includes:
        - Bambu Lab A1 0.4 nozzle template machine_start_gcode
        - Bambu Lab A1 0.4 nozzle template machine_end_gcode
        - Bambu Lab A1 0.4 nozzle template time_lapse_gcode
        - Bambu Lab A1 0.4 nozzle template change_filament_gcode
        - Bambu Lab A1 0.4 nozzle template layer_change_gcode
      sha256: bc1aadae552a0ee02e90b7ae17a1ec9d30726ab31cf783ea6ed1a19600df63ac
    process:
      file: process.json
      preset: 0.20mm Standard @BBL A1
      chain: [fdm_process_common, fdm_process_single_common, fdm_process_single_0.20,
              0.20mm Standard @BBL A1]
      sha256: b4af99bd1e6c8256430ae7c21604aa755e63a9e33ac8871d58a60ddde2e8988c
    filament:
      file: filament.json
      preset: Bambu PLA Basic @BBL A1
      chain: [fdm_filament_common, fdm_filament_pla, Bambu PLA Basic @base,
              Bambu PLA Basic @BBL A1]
      sha256: 0254183f025d9f34351caa8371018bae540203344020ec69fc9bd5be0d741104
  # source-manifest.json as flatten_with_include.py wrote it (CRLF, like the 2026-11-10
  # record's; that record's README addendum, item 5).
  manifest_sha256: cfcbb8d7e125ccbdb0d99db35b6c3a4f0fd37d48e641ab932171ac5fec391b29
  # SHA-256 (of the UTF-8 text) of OrcaSlicer's default for each setting an included
  # template sets: PrintConfig.cpp at tag v2.5.0, quoted with their lines in
  # research/verification/2026-11-13-a1-profile-include/source-excerpts.txt. OrcaSlicer
  # layers an include's diff against the default, so a template value equal to it would
  # not override the parent; the flattener refuses one instead of merging it.
  include_defaults_sha256:
    machine_start_gcode: a0f4e4a808f09edbe1b6623706b3221e7fc68082385854458e6e7dd92dfa9f2a
    machine_end_gcode: 45ae4f8664a87969fb4f7052aaa287b4eaecb1db9964024f7e683a1e86bfe996
    time_lapse_gcode: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    change_filament_gcode: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    layer_change_gcode: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
  # SHA-256 of each upstream file in the chains and includes (source-manifest.json), by
  # path under BBL/.
  upstream_sha256:
    filament/Bambu PLA Basic @BBL A1.json: 966589ca1c1d5007a470fb0d60e42a4fae2b15ef2fba535fbd8ad72aa92c047d
    filament/Bambu PLA Basic @base.json: 596726a8e36bf0c4f616e386335dfbdf05898e3234d64b8bafd26d2945451f85
    filament/fdm_filament_common.json: 8c7105b7d59a28f600c43a946f067b8b4d707b9711c0bf6b88e9166e48878548
    filament/fdm_filament_pla.json: 670d21ea6bdf1cd4b0a2bfddc743612ffd896cd6e5dbe767c25d2c4165c49a30
    machine/Bambu Lab A1 0.4 nozzle template change_filament_gcode.json: 7ebc3110db59ff860bad63d920a8679409f345857010bdee4f807d378b52e0ca
    machine/Bambu Lab A1 0.4 nozzle template layer_change_gcode.json: ded9e9dbfaa4640359461570a12282ae040b0cd7afc834486464baf16907f13f
    machine/Bambu Lab A1 0.4 nozzle template machine_end_gcode.json: 8ba4745a04eca676e20d03c892e7c2196e0c851ea8d6d1a6a3edc4e57fbf141b
    machine/Bambu Lab A1 0.4 nozzle template machine_start_gcode.json: 714b0dc75b8cf442c8845b8e072598780b40ff42cfe5cd33a528c51e3687a765
    machine/Bambu Lab A1 0.4 nozzle template time_lapse_gcode.json: febd4212ae7fbb9df52597372341520f6bde96d81634b896d25269f99bdf9e12
    machine/Bambu Lab A1 0.4 nozzle.json: 1291507434ad10363d164ed4b31a2bbd2e9410479b533aa824a4e1ada4ca04f4
    machine/fdm_bbl_3dp_001_common.json: 982c81d5f93762970befc453bb99352b6dbeb4c8b88dd5ae271eb7fa416fe5b0
    machine/fdm_machine_common.json: cee021d6dbf12c2bf0bc6e2394cb4f0fa37af78296930cc753498f7ad3341a4a
    process/0.20mm Standard @BBL A1.json: 2bd33159b3ec659567a63b6ea6f5373af7431c68516e7d3e02693a4cef395079
    process/fdm_process_common.json: 25602054557e1fed37fd530e12914640c1ec33910f526dbc96deab4a016997d1
    process/fdm_process_single_0.20.json: cdda8d56d67f62a0faa892cb6efc605ebb5c745bf742f6ead4daaeb6627c182a
    process/fdm_process_single_common.json: 05b38ac1318e465e817978b36da51754f928da0172738a20bb3a8d4a69eb4769

# How a parent process sees the slicer's exit code, per platform.
decoding:
  windows:
    rule: unsigned32        # the full 32-bit code, unsigned: -50 arrives as 4294967246
    status: measured
    source: >-
      research/verification/2026-11-10-orcaslicer-windows/README.md: Windows exit codes
      are not truncated.
  posix:
    rule: low8              # the low 8 bits: -50 arrives as 206
    status: assumed
    source: "CLAUDE.md environment facts (M5 notes, 2026-11-08/09); not re-measured for 2.5.0"

# Exit codes: the CLI_* #defines in src/libslic3r/Utils.hpp at tag v2.5.0.
exit_codes_source: src/libslic3r/Utils.hpp at tag v2.5.0 (fetched 2026-11-10, sha256 fa08fea0cb0aa37b397a05b2543ceaa8318c49193fb6389cc90247f07d793433)

# PrusaSlicer 2.9.7, pinned for F6.portability in `tdmg slice`.
#
# The release, the zip SHA-256 and the console exe hash are copied from
# research/verification/2026-11-11-prusaslicer-windows/ (README.md, install-hashes.txt);
# tests/test_portability.py checks them against those files. That record has no hash for
# PrusaSlicer.dll or the app tree. Both were computed on 2026-11-11 with
# tdmg.slicer.sha256_file and tdmg.slicer.app_tree_sha256 from the install in
# artifacts/tools/prusaslicer-2.9.7/app/, and a fresh extraction of the hash-checked zip gave
# the same tree (1,119 files, same hash).
# Lines holding a hash or a URL may exceed 100 characters; they are not wrapped, so each
# value stays copyable as one string.
#
# PrusaSlicer is AGPL-3.0. It is only run as a subprocess. No PrusaSlicer code or profile
# file is in this repo: only hashes and names (facts). No vendor profile is used: every
# setting is passed on the command line from the pinned OrcaSlicer A1 profiles.
id: prusaslicer-2.9.7
name: PrusaSlicer
version: "2.9.7"
tag: version_2.9.7
licence: AGPL-3.0 (run as a separate program only; never copied into this repo)
record: research/verification/2026-11-11-prusaslicer-windows/README.md

release:
  platform: windows-x64
  asset: PrusaSlicer-2.9.7.zip
  # The GitHub release-download URL for this tag and asset; the sha256 below is what makes
  # it trusted (it equals the digest GitHub publishes, research README).
  url: https://github.com/prusa3d/PrusaSlicer/releases/download/version_2.9.7/PrusaSlicer-2.9.7.zip
  sha256: 5d4f395aeb6c344b300e0e1be37a0e1931622b642c3c3085eb19cdae211bc008

# The console build, which prints to stdout. Paths are relative to the slicer folder the
# setup script writes; the zip holds one top-level folder, PrusaSlicer-2.9.7/, extracted
# into app/.
exe:
  path: app/PrusaSlicer-2.9.7/prusa-slicer-console.exe
  sha256: 086bcf2ba47625738cf2ec120975eb8d78a16fb432c4ed05a95c1b7ed130dbff

# Checked with the exe before every run (tdmg.portability.locate_prusaslicer).
libraries:
  - path: app/PrusaSlicer-2.9.7/PrusaSlicer.dll
    sha256: 6070610345f2c4c56fdfc462c64218b68a9d2dac9973674cc2a7642e3bc73c7c

# Every file under app/, with the same definition as the OrcaSlicer pin: the SHA-256 of the
# UTF-8 lines "<path relative to app/, with />\t<file sha256>\n", sorted as Python strings.
app_tree:
  folder: app
  files: 1119
  sha256: 5515fb4aecfadd7f97bb9dee5639ec14e6f19ae0d3330bddd3594f486d0b921a

# How the exit code reaches a parent process. Only Windows is set up (Windows x64 only).
decoding:
  windows:
    error_exit: 1           # every error measured exited 1 (unreadable or missing file)
    status: measured
    source: >-
      research/verification/2026-11-11-prusaslicer-windows/README.md: PrusaSlicer reports
      errors with exit code 1, and an exit code of 0 is not success (an outside-bed part
      exits 0 with no G-code; an open mesh exits 0 with a truncated G-code).

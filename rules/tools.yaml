# Limits and measured behaviour of specific tools. kind: tool_limit.
- id: slicer.orca.max_triangles_per_plate
  kind: tool_limit
  summary: OrcaSlicer refuses a plate with more triangles than this, unless the limit is changed.
  unit: triangles
  default: 1000000
  evidence:
    - ref: "research_notes/Image to printable 3D model landscape/mesh_validation_repair_formats_slicers.md"
      locator: "max triangles/plate, default 1,000,000"
      provenance: primary
      validation: untested
      claim: OrcaSlicer CLI option --mtcpp; exceeding it exits with internal code -59 (seen as 197 by a parent process).
      source_url: "https://github.com/OrcaSlicer/OrcaSlicer/wiki/cli_actions"
  notes: Configurable with --mtcpp. Decimate below this before slicing.

- id: vectorize.opencv.contour_offset_px
  kind: tool_limit
  summary: cv2.findContours traces foreground pixel centres, so outer edges sit this far inside and hole edges this far outside the pixel-cell outline.
  unit: px
  default: 0.5
  evidence:
    - ref: research/verification/2026-11-08-stack-smoke/README.md
      locator: "traced holes come out too large."
      provenance: primary
      validation: measured
      claim: Measured locally in software (no print); a 3x3-pixel hole (9 cells) traces as area 14.
  notes: Observed bias, not a correction. A +0.5 px buffer fixes area approximately but the boundary can still be 0.5 px off (Hausdorff), so dimensions must be validated against a chosen reference outline.

# How slicers read color from a 3MF. Source reading, not runs: research/verification/2026-11-09-slicer-3mf-import.
- id: slicer.prusaslicer.ignores_3mf_material_properties
  kind: tool_limit
  summary: PrusaSlicer 2.9.7 ignores the standard 3MF Materials extension (pid, p1-p3), so standard color tags do not reach it.
  unit: bool
  default: true
  evidence:
    - ref: research/verification/2026-11-09-slicer-3mf-import/README.md
      locator: "we are ignoring the following attributes: p1 p2 p3 pid"
      provenance: primary
      validation: untested
      claim: Comment in PrusaSlicer version_2.9.7 src/libslic3r/Format/3mf.cpp, triangle parser.
      source_url: "https://raw.githubusercontent.com/prusa3d/PrusaSlicer/version_2.9.7/src/libslic3r/Format/3mf.cpp"

- id: slicer.prusaslicer.reads_bambu_paint_color
  kind: tool_limit
  summary: PrusaSlicer 2.9.7 reads Bambu's per-triangle paint_color attribute when its own mmu_segmentation attribute is absent.
  unit: bool
  default: true
  evidence:
    - ref: research/verification/2026-11-09-slicer-3mf-import/README.md
      locator: 'mm_segmentation_serialized = get_attribute_value_string(attributes, num_attributes, "paint_color");'
      provenance: primary
      validation: untested
      claim: Fallback added for PrusaSlicer issue 12502.
      source_url: "https://raw.githubusercontent.com/prusa3d/PrusaSlicer/version_2.9.7/src/libslic3r/Format/3mf.cpp"

- id: slicer.orca.maps_colorgroup_to_extruders
  kind: tool_limit
  summary: OrcaSlicer 2.5.0 assigns a filament from a top-level object's own color group only; each group keeps one color, and colors on parts inside an assembly are not used.
  unit: bool
  default: true
  notes: So each colored body should be a top-level object with its own single-color group. Bambu Studio's reader differs (slicer.bambu.converts_foreign_standard_colors).
  evidence:
    - ref: research/verification/2026-11-09-slicer-3mf-import/README.md
      locator: "auto extruder_itor = color_group_id_to_extruder_id_map.find(current_object->second.pid);"
      provenance: primary
      validation: untested
      claim: Assignment looks up the top-level object's pid in OrcaSlicer v2.5.0 bbs_3mf.cpp.
      source_url: "https://raw.githubusercontent.com/OrcaSlicer/OrcaSlicer/v2.5.0/src/libslic3r/Format/bbs_3mf.cpp"
    - ref: research/verification/2026-11-09-slicer-3mf-import/README.md
      locator: "m_group_id_to_color[m_current_color_group] = color;"
      provenance: primary
      validation: untested
      claim: Each color group stores one color; later colors in the same group overwrite earlier ones.
      source_url: "https://raw.githubusercontent.com/OrcaSlicer/OrcaSlicer/v2.5.0/src/libslic3r/Format/bbs_3mf.cpp"

- id: slicer.bambu.converts_foreign_standard_colors
  kind: tool_limit
  summary: Bambu Studio (master, 2026-11-09) reads standard 3MF colors fully, and for files from other programs sends them through its color-matching import, clearing any preset filament assignment.
  unit: bool
  default: true
  notes: Read from the master branch, which may differ from the release the owner runs.
  evidence:
    - ref: research/verification/2026-11-09-slicer-3mf-import/README.md
      locator: "The 3mf is not from Bambu Lab, load geometry data and color data only."
      provenance: primary
      validation: untested
      claim: Bambu Studio master src/slic3r/GUI/Plater.cpp, foreign 3MF import path.
      source_url: "https://raw.githubusercontent.com/bambulab/BambuStudio/master/src/slic3r/GUI/Plater.cpp"
    - ref: research/verification/2026-11-09-slicer-3mf-import/README.md
      locator: "std::map<ColorKey, int> color_group_index_to_extruder_id_map;"
      provenance: primary
      validation: untested
      claim: Bambu Studio master bbs_3mf.cpp keys colors by group and index.
      source_url: "https://raw.githubusercontent.com/bambulab/BambuStudio/master/src/libslic3r/Format/bbs_3mf.cpp"

- id: slicer.prusaslicer.expands_component_assemblies
  kind: tool_limit
  summary: PrusaSlicer 2.9.7 expands a 3MF component assembly into separate object instances, so grouping does not survive import.
  unit: bool
  default: true
  evidence:
    - ref: research/verification/2026-11-09-slicer-3mf-import/README.md
      locator: "if (!_create_object_instance(component.object_id, transform * component.transform, printable, recur_counter + 1))"
      provenance: primary
      validation: untested
      claim: Recursive component expansion in PrusaSlicer version_2.9.7 3mf.cpp.
      source_url: "https://raw.githubusercontent.com/prusa3d/PrusaSlicer/version_2.9.7/src/libslic3r/Format/3mf.cpp"

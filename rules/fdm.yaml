# General FDM design rules. kind: empirical. Defaults are the conservative end; ranges show source disagreement.
- id: fdm.wall.min_thickness
  kind: empirical
  summary: Minimum wall thickness, two perimeters with a 0.4 mm nozzle.
  unit: mm
  default: 0.9
  range: [0.45, 1.6]
  conditions: {nozzle_diameter_mm: 0.4}
  evidence:
    - ref: "research_notes/Image to printable 3D model landscape/fdm_design_rules_and_ai_ecosystem.md"
      locator: "1 perimeter 0.45 mm, 2 → 0.9 mm"
      provenance: primary
      validation: untested
      claim: Prusa KB perimeter widths for a 0.4 mm nozzle; walls between one and two perimeters are marked not printable.
      source_url: "https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135"
    - ref: "research_notes/Image to printable 3D model landscape/fdm_design_rules_and_ai_ecosystem.md"
      locator: "minimum walls run 0.45 mm (one perimeter) to 1.2–1.6 mm"
      provenance: secondary
      validation: untested
      claim: Research summary of the spread across Prusa and service-bureau guides.

- id: fdm.wall.absolute_floor
  kind: empirical
  summary: Walls thinner than one perimeter cannot print at all.
  unit: mm
  default: 0.45
  conditions: {nozzle_diameter_mm: 0.4}
  evidence:
    - ref: "research_notes/Image to printable 3D model landscape/fdm_design_rules_and_ai_ecosystem.md"
      locator: "Walls thinner than one nozzle perimeter are not printable"
      provenance: primary
      validation: untested
      claim: Prusa KB.
      source_url: "https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135"

- id: fdm.overhang.max_angle
  kind: empirical
  summary: Steepest unsupported overhang, measured from vertical.
  unit: deg
  default: 45
  range: [45, 60]
  measured_as: angle from vertical
  evidence:
    - ref: "research_notes/Image to printable 3D model landscape/fdm_design_rules_and_ai_ecosystem.md"
      locator: "can usually be printed up to 45° without compromising quality"
      provenance: primary
      validation: untested
      claim: Hubs FDM design guide.
      source_url: "https://www.hubs.com/knowledge-base/how-design-parts-fdm-3d-printing/"
    - ref: "research_notes/Image to printable 3D model landscape/fdm_design_rules_and_ai_ecosystem.md"
      locator: "overhang limit 45° (Hubs, Xometry) / 55–60° (Bambu PLA TDS, Prusa)"
      provenance: secondary
      validation: untested
      claim: Tuned printers reach 55–60°; the Bambu PLA datasheet value was seen only as a search snippet.

- id: fdm.bridge.max_length
  kind: empirical
  summary: Longest unsupported horizontal bridge.
  unit: mm
  default: 5
  range: [5, 30]
  evidence:
    - ref: "research_notes/Image to printable 3D model landscape/fdm_design_rules_and_ai_ecosystem.md"
      locator: "Horizontal bridge, max unsupported length 10 mm"
      provenance: primary
      validation: untested
      claim: Xometry FDM guide gives 10 mm.
      source_url: "https://xometry.pro/en/?p=154421"
    - ref: "research_notes/Image to printable 3D model landscape/fdm_design_rules_and_ai_ecosystem.md"
      locator: "bridge 5 mm (Hubs) / 10 mm (Xometry) / 30 mm (Bambu PLA TDS)"
      provenance: secondary
      validation: untested
      claim: Spread across sources; 5 mm is the conservative default.

- id: fdm.hole.min_diameter
  kind: empirical
  summary: Smallest hole diameter to design; holes print undersized.
  unit: mm
  default: 2.0
  range: [1.5, 2.0]
  evidence:
    - ref: "research_notes/Image to printable 3D model landscape/fdm_design_rules_and_ai_ecosystem.md"
      locator: "min hole 1.5 mm (depth 1.5–4.5 mm), 2.0 mm (depth 2–6 mm)"
      provenance: primary
      validation: untested
      claim: JLC3DP design guideline; deeper holes need the larger minimum.
      source_url: "https://jlc3dp.com/help/article/3d-printing-design-guideline"

- id: fdm.text.emboss_min_height
  kind: empirical
  summary: Minimum height of raised (embossed) text or detail.
  unit: mm
  default: 0.5
  evidence:
    - ref: "research_notes/Image to printable 3D model landscape/fdm_design_rules_and_ai_ecosystem.md"
      locator: "min embossed text height 0.50 mm"
      provenance: primary
      validation: untested
      claim: Xometry FDM guide.
      source_url: "https://xometry.pro/en/?p=154421"

- id: fdm.text.min_char_height
  kind: empirical
  summary: Minimum character height for legible text.
  unit: mm
  default: 3.5
  evidence:
    - ref: "research_notes/Image to printable 3D model landscape/fdm_design_rules_and_ai_ecosystem.md"
      locator: "min font (character height) 3.5 mm"
      provenance: primary
      validation: untested
      claim: Xometry FDM guide; 5 mm recommended.
      source_url: "https://xometry.pro/en/?p=154421"

- id: fdm.clearance.moving_parts_min
  kind: empirical
  summary: Starting gap between surfaces that must move freely (axis not specified by the source).
  unit: mm
  default: 0.3
  scales_with_model: false
  evidence:
    - ref: "research_notes/Image to printable 3D model landscape/fdm_design_rules_and_ai_ecosystem.md"
      locator: "An initial good measurement for movable parts is at least 0.3 mm"
      provenance: primary
      validation: untested
      claim: Prusa KB; it stresses that no universal value exists.
      source_url: "https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135"
  notes: Joint-specific rules (joint.*) take precedence where they exist.

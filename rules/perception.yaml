# Subject selection (stage S1). Our own defaults, chosen from software measurements on two
# owner images. kind stays hypothesis (validation untested) until wider tests support them.
- id: perception.alpha.min_opaque
  kind: hypothesis
  summary: A pixel counts as opaque image content if its 8-bit alpha is at least this.
  unit: alpha8
  default: 128
  range: [1, 255]
  evidence:
    - ref: research/verification/2026-11-10-subject-selection/README.md
      locator: "Oddie is one 8-connected piece at every alpha cutoff tested"
      provenance: primary
      validation: untested
      claim: On Oddie, the five cutoffs tested (1, 64, 128, 192 and 255) all give one piece; area changes by 2.2% between 1 and 255. This image does not discriminate between cutoffs, so it shows insensitivity, not support for 128 in particular. 128 is the half-coverage convention. Software measurement on one image (see ref); as a hypothesis, the rule itself stays untested.
  notes: Adjustable with --alpha-min. It matters only for images with partly transparent pixels. The range is the full 8-bit domain above zero, not a tested band.

- id: perception.flood.color_tolerance
  kind: hypothesis
  summary: Euclidean distance in 8-bit RGB within which a pixel joins the colour region grown from a --remove-at point.
  unit: rgb8_distance
  default: 30
  range: [0, 441.7]
  evidence:
    - ref: research/verification/2026-11-10-subject-selection/README.md
      locator: "At tolerances 20, 30 and 40 the bird stays one piece; at 60 it splits."
      provenance: primary
      validation: untested
      claim: On Roadie, removing the disc from one seed left the bird as one piece at 20, 30 and 40 and split it at 60. 30 is the middle of the range that worked. Software measurement on one image (see ref); as a hypothesis, the rule itself stays untested.
  notes: Adjustable with --tolerance. On Roadie, lower values kept more of the dark fringe around the bird, and 60 split the bird into several pieces. Check the preview. The range is the full domain, 0 to 255 times the square root of 3 (441.67) rounded up, not a tested band.

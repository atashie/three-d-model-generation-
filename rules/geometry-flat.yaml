# Rules for flat / 2.5D extrusion (G1).
- id: flat.island.min_square_side
  kind: hypothesis
  summary: Drop traced islands whose area is below (this many nozzle widths)^2.
  unit: x_nozzle
  default: 2.0
  applies_to: {geometry: [G1]}
  evidence:
    - ref: "research_notes/Image to printable 3D model landscape/image_to_flat_and_relief_pathways.md"
      locator: "drop islands below a minimum area (e.g., < (2×nozzle)²)"
      provenance: unverified
      validation: untested
      claim: Research team's engineering inference from nozzle geometry; no published source.
  notes: Minimum area = (value * nozzle_diameter)^2, so 0.64 mm^2 for a 0.4 mm nozzle.

- id: flat.sliver.opening_width
  kind: hypothesis
  summary: Shrink then regrow each shape by half this width to delete slivers narrower than it (an opening).
  unit: mm
  default: 0.4
  range: [0.4, 0.5]
  applies_to: {geometry: [G1]}
  evidence:
    - ref: "research_notes/Image to printable 3D model landscape/image_to_flat_and_relief_pathways.md"
      locator: "Shapely `buffer(-w/2).buffer(+w/2)` with w ≈ 0.4–0.5 mm"
      provenance: unverified
      validation: untested
      claim: Research team's engineering inference (morphological opening at nozzle width).

- id: template.cookie_cutter.wall
  kind: hypothesis
  summary: Cutter blade wall thickness used as the default by open cookie-cutter generators.
  notes: "A software default, not a printing result. fdm.wall.min_thickness (0.9 mm) takes precedence, so recipes use the larger of the two. Geometry only: no food-contact safety claim (docs/PLAN.md section 9b)."

  unit: mm
  default: 0.8
  applies_to: {geometry: [G1]}
  evidence:
    - ref: "research_notes/Image to printable 3D model landscape/image_to_flat_and_relief_pathways.md"
      locator: "cutter wall ≈0.8 mm"
      provenance: primary
      validation: untested
      claim: Default exposed by open cookie-cutter generators (e.g. CZDanol/cookieCutterStlGenerator); evidence of the default, not of print performance.
      source_url: "https://github.com/CZDanol/cookieCutterStlGenerator"
    - ref: "research_notes/Image to printable 3D model landscape/image_to_flat_and_relief_pathways.md"
      locator: "wall thickness should be an integer multiple of extrusion width (0.8 or 1.2 mm for a 0.4 mm nozzle)"
      provenance: unverified
      validation: untested
      claim: Research team's inference so slicers produce solid walls.

- id: flat.smooth.sigma_px
  kind: hypothesis
  summary: Gaussian blur (in image pixels) applied to the binary mask before taking its 0.5 iso-contour, to smooth jagged outlines of soft or low-resolution images.
  unit: px
  default: 2.5
  applies_to: {geometry: [G1]}
  evidence:
    - ref: research/verification/2026-11-10-outline-smoothing/README.md
      locator: "candidate A at σ 2.5 px gave the smoothest, most cartoon-like outline"
      provenance: primary
      validation: untested
      claim: Compared by eye on two crops of one owner image (Roadie) against 1.5 px and three other methods; area change -0.43%. Software comparison on one image; as a hypothesis the rule stays untested.
  notes: Set in pixels because the jaggedness comes from image resolution and compression, not print size. Rounds real corners and can merge or split features on a scale of about sigma. 0 (no smoothing) is chosen by not calling the smoother (tdmg flat --smooth-px 0).

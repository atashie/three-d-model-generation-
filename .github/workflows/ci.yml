name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple Silicon (arm64), the same architecture as the target Mac.
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (exactly as locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Generated docs are current
        run: uv run python scripts/gen_docs.py --check
      - name: Tests
        shell: bash
        # Job logs need a GitHub sign-in, but annotations are public through the API, so
        # each failing test's short summary line is also written as an error annotation.
        run: |
          set -o pipefail
          status=0
          uv run pytest -rfE 2>&1 | tee "$RUNNER_TEMP/pytest.txt" || status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR) ' "$RUNNER_TEMP/pytest.txt" | cut -c1-900 \
              | sed 's/^/::error title=pytest::/' || true
          fi
          exit "$status"
      - name: An installed wheel finds its packaged rules and profiles
        shell: bash
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/wheeltest" --python 3.13
          if [ "$RUNNER_OS" = "Windows" ]; then
            wheel_python="$RUNNER_TEMP/wheeltest/Scripts/python.exe"
          else
            wheel_python="$RUNNER_TEMP/wheeltest/bin/python"
          fi
          uv pip install --python "$wheel_python" dist/*.whl
          cd "$RUNNER_TEMP"
          n=$("$wheel_python" -m tdmg.cli rules | wc -l)
          echo "rules found by the installed package: $n"
          test "$n" -ge 15
          "$wheel_python" -c "from tdmg.slicer import load_pin; print('slicer pin:', load_pin().id)"
